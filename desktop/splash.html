<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Wellness Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    .logo-container {
      position: relative;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    .spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(59, 130, 246, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .logo-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .status-bar {
      width: 240px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .status-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 999px;
      animation: progress 1.6s ease-in-out infinite;
    }
    .status-text {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes progress {
      0% { left: -40%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="spinner"></div>
    <div class="logo-inner">🧘‍♂️</div>
  </div>
  <h1>Digital Wellness Assistant</h1>
  <p>AI Ergonomics & Posture Monitoring</p>
  <div class="status-bar">
    <div class="status-bar-fill"></div>
  </div>
  <div class="status-text" id="status">Starting AI Vision Engine...</div>

  <script>
    // Status text updates from main process via hash or query param
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const msg = params.get('msg');
      if (msg) document.getElementById('status').innerText = msg;
    });
  </script>
</body>
</html>
